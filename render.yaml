# Render Blueprint for the existing PLM BSA Alumni static site.
# This branch is based on integration/mainline-production-hardening.
# Apply only after review and after confirming the service mapping in Render.
services:
  - type: web
    name: plm-alumni-accountancy-
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /admin/login
        destination: /index.html
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /admin/homepage
        destination: /index.html
      - type: rewrite
        source: /admin/alumni
        destination: /index.html
      - type: rewrite
        source: /admin/events
        destination: /index.html
      - type: rewrite
        source: /admin/batches
        destination: /index.html
      - type: rewrite
        source: /admin/credentials
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /reset-password
        destination: /index.html
      - type: rewrite
        source: /alumni
        destination: /index.html
      - type: rewrite
        source: /events
        destination: /index.html
      - type: rewrite
        source: /batches
        destination: /index.html
      - type: rewrite
        source: /dashboard
        destination: /index.html
      - type: rewrite
        source: /dashboard/profile
        destination: /index.html
      - type: rewrite
        source: /dashboard/credentials
        destination: /index.html
      - type: rewrite
        source: /dashboard/achievements
        destination: /index.html
      - type: rewrite
        source: /dashboard/batch
        destination: /index.html
      - type: rewrite
        source: /dashboard/events
        destination: /index.html
